name: qbo-ops
version: 0.1.0
description: "QuickBooks Online operations for Hermes: connection health, P&L reports, close audits and deposit tracing — with a desktop status pane. Reconciliation tradecraft built in, not just API plumbing."
author: Frank Schwarz
kind: backend
requires_hermes: ">=0.19"
python_runtime: external
provides_tools:
  - qbo_health
  - qbo_pnl
  - qbo_udf_audit
  - qbo_deposit_trace
provides_hooks: []
provides_middleware: []
requires_env:
  - name: QBO_OPS_CLIENT_ID
    description: "Intuit app client ID (from developer.intuit.com)"
    secret: false
  - name: QBO_OPS_CLIENT_SECRET
    description: "Intuit app client secret"
    secret: true
  - name: QBO_OPS_REFRESH_TOKEN
    description: "QBO OAuth refresh token (BYO-token setup)"
    secret: true
  - name: QBO_OPS_REALM_ID
    description: "QBO company (realm) ID"
    secret: false
license: MIT
tags: [quickbooks, accounting, bookkeeping, finance, smb]
