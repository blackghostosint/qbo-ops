name: qbo-ops
version: 0.2.0
description: "QuickBooks Online operations for Hermes: connection health, P&L reports, close audits, deposit tracing and a guarded read-only SQL query tool — with a web/desktop dashboard and bundled reconciliation skill. Reconciliation tradecraft built in, not just API plumbing."
author: Frank Schwarz
kind: backend
requires_hermes: ">=0.19"
python_runtime: external
provides_tools:
  - qbo_health
  - qbo_pnl
  - qbo_udf_audit
  - qbo_deposit_trace
  - qbo_query
provides_hooks: []
provides_middleware: []
requires_env:
  - name: QBO_OPS_CLIENT_ID
    description: "Intuit app client ID (from developer.intuit.com)"
    secret: false
  - name: QBO_OPS_CLIENT_SECRET
    description: "Intuit app client secret — used only by Hermes's oauth: grant flow, never read by plugin code"
    secret: true
  - name: QBO_OPS_REALM_ID
    description: "QBO company (realm) ID"
    secret: false
oauth:
  - id: quickbooks
    authorize_url: https://appcenter.intuit.com/connect/oauth2
    token_url: https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer
    scopes:
      - com.intuit.quickbooks.accounting
    client_id_env: QBO_OPS_CLIENT_ID
    client_secret_env: QBO_OPS_CLIENT_SECRET
    hosts: [quickbooks.api.intuit.com]
config_schema:
  allow_writes:
    type: boolean
    default: false
    description: "Enable WRITE operations (creating/editing QBO transactions). Read-only unless YOU flip this. Writes also pass through Hermes's normal approval surface. Intentionally disabled in v0.2 — the write tool ships after sandbox verification."
license: MIT
tags: [quickbooks, accounting, bookkeeping, finance, smb]
